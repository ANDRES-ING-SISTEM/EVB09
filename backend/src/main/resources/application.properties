server.port=${PORT:8080}

# Configuración de Base de Datos PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/citas_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate para PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Parámetros de JWT
jwt.secret=${JWT_SECRET:9a2f8c4e1b7d5e3f9a2f8c4e1b7d5e3f9a2f8c4e1b7d5e3f9a2f8c4e1b7d5e3f}
jwt.expiration=86400000

# CORS Dinámico
cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}

# Sprint 2: anticipación mínima (en horas) para cancelar / reprogramar una cita.
# Para una demo con citas cercanas se puede poner 0 (o la variable de entorno correspondiente).
citas.cancelacion.horas-minimas=${CITAS_CANCELACION_HORAS_MINIMAS:24}
citas.reprogramacion.horas-minimas=${CITAS_REPROGRAMACION_HORAS_MINIMAS:24}
